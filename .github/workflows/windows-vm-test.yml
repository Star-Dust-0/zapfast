# ============================================================================
# windows-vm-test - Real Windows 11 GUI verification on a dockur/windows VM
# Adapted from the canonical template (Star-Dust-0/fluent-prayer-times).
# MANUAL TRIGGER ONLY (standing owner rule): boots a full Windows VM.
# Verifies test-matrix section C (docs/testing-v1.md): GUI launch in demo
# mode, light/dark themes, forced RTL, installer, data dirs - real
# screenshots, no account of any kind.
# ============================================================================
name: windows-vm-test
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-vm-test
  cancel-in-progress: true

jobs:
  win:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Stage the latest green build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow build.yml --status success --branch main --limit 1 --json databaseId -q '.[0].databaseId')
          echo "build run: $run_id"
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' shell/FluentChat/FluentChat.csproj)
          echo "version: $version"
          mkdir -p shared stage
          url=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/artifacts" | jq -r '.artifacts[0].archive_download_url')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" -o stage/artifact.zip
          unzip -q stage/artifact.zip -d stage
          ls -la stage
          cp stage/*portable*.zip shared/
          cp stage/out/*.exe shared/
          cp .dockur-test/run.ps1 shared/run.ps1
          ls -la shared
      - name: KVM check
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          ls -l /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Start dockur/windows
        run: |
          docker run -d --name win -e VERSION=11l -e RAM_SIZE=6G -e CPU_CORES=3 -e DISK_SIZE=40G \
            --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 7100:7100 -e ARGUMENTS="-monitor telnet:0.0.0.0:7100,server,nowait" \
            -v $PWD/shared:/shared -v $PWD/.dockur-test/oem:/oem docker.io/dockurr/windows
          sleep 20; docker logs win | tail -20
      - name: Wait for Windows
        run: |
          start=$(date +%s)
          for i in $(seq 1 130); do
            grep -q DONE shared/result.txt 2>/dev/null && break
            if [ $((i%6)) -eq 0 ]; then
              echo "t=$(( $(date +%s)-start ))s"; docker logs win 2>&1 | tail -3
            fi
            sleep 20
          done
          echo "total $(( $(date +%s)-start ))s"; cat shared/result.txt shared/ps-log.txt || echo NO_RESULT; ls -la shared
      - name: Assert guest results
        if: always()
        run: |
          test -f shared/result.txt && grep -q DONE shared/result.txt
          test -f shared/ps-log.txt
          if grep -E 'FAIL\[|never appeared|died after|TIMED OUT|standalone-core: EXIT' shared/ps-log.txt; then
            echo 'Guest verification failed'; exit 1
          fi
          for evidence in 'PASS\[restart\]' 'PASS\[upgraded\]: demo message echo rendered' 'PASS\[light1\]: empty send disabled'; do
            grep -q "$evidence" shared/ps-log.txt || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-vm-test-out
          path: |
            shared/*.png
            shared/*.txt
          retention-days: 3
      - if: always()
        run: docker logs win 2>&1 | tail -40
