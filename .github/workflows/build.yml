name: Build Fluent Chat
# Manual trigger only for now: the repo owner approves every real run while
# phase 1 is in flight (public repo, so no billed minutes, but runs are loud).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        env:
          CACHE_ON_FAILURE: true
      - name: Check + build Rust core
        shell: pwsh
        run: |
          cargo check --bin fluentchatd
          if ($LASTEXITCODE -ne 0) { throw 'core check failed' }
          cargo build --release --bin fluentchatd
          if ($LASTEXITCODE -ne 0) { throw 'core build failed' }
      - name: Core raw pipe probe (cmd redirect, demo + real)
        shell: pwsh
        run: |
          $frames = @('{"jsonrpc":"2.0","id":1,"method":"ping"}', '{"jsonrpc":"2.0","id":2,"method":"shutdown"}')
          [System.IO.File]::WriteAllLines("$PWD/frames.jsonl", $frames)
          cmd /c "set FLUENTCHAT_DEMO=1&& target\release\fluentchatd.exe < frames.jsonl > probe-demo-out.jsonl 2> probe-demo-err.txt"
          Get-Content probe-demo-err.txt
          if ((Get-Content probe-demo-out.jsonl -Raw) -notmatch '"pong":true') { throw 'raw demo probe: no pong' }
          Write-Output 'raw demo probe: pong OK'
          cmd /c "target\release\fluentchatd.exe < frames.jsonl > probe-real-out.jsonl 2> probe-real-err.txt"
          Get-Content probe-real-err.txt
          if ((Get-Content probe-real-out.jsonl -Raw) -notmatch '"pong":true') { throw 'raw real probe: no pong' }
          Write-Output 'raw real probe: pong OK'
          cmd /c "set FLUENTCHAT_TRACE=1&& set FLUENTCHAT_DEMO=1&& type frames.jsonl | target\release\fluentchatd.exe > probe-pipe-out.jsonl 2> probe-pipe-err.txt"
          Get-Content probe-pipe-err.txt
          if ((Get-Content probe-pipe-out.jsonl -Raw) -notmatch '"pong":true') { throw 'cmd pipe probe: no pong' }
          Write-Output 'cmd pipe probe: pong OK'
      - name: Core pipe verification (.NET probe, B1-B6)
        shell: pwsh
        run: dotnet run --project verification/DotnetPipeProbe --configuration Release -- target/release/fluentchatd.exe
      - name: Build WinUI shell
        shell: pwsh
        run: |
          msbuild shell/FluentChat/FluentChat.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:Platform=x64 /p:PublishDir=../../publish/ /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'shell publish failed' }
      - name: Bundle core next to shell
        shell: pwsh
        run: |
          New-Item publish/core -ItemType Directory -Force | Out-Null
          Copy-Item target/release/fluentchatd.exe publish/core/
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)/*.dll" publish -Force }
      - name: Package portable zip and installer
        shell: pwsh
        run: |
          $xml = [xml](Get-Content shell/FluentChat/FluentChat.csproj)
          $version = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw 'No Version in csproj' }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item LICENSE publish/LICENSE.txt
          Compress-Archive publish/* "FluentChat-v$version-portable-win-x64.zip"
          Copy-Item installer/self-contained.iss self-contained.iss
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /DAppVersion=$version self-contained.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
        id: package
      - uses: actions/upload-artifact@v4
        with:
          name: fluent-chat-v${{ steps.package.outputs.version }}-win-x64
          path: |
            publish/
            FluentChat-v*-portable-win-x64.zip
            out/*.exe
